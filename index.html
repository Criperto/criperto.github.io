<!DOCTYPE html>
<html lang="es-AR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Criperto: apps hechas por Tomás</title>
  <meta name="description" content="Portafolio de Criperto. La lista de proyectos sale en vivo de mi GitHub.">
  <meta name="theme-color" content="#0F0E0D">
  <meta property="og:title" content="Criperto: apps hechas por Tomás">
  <meta property="og:description" content="Portafolio de Criperto. La lista de proyectos sale en vivo de mi GitHub.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://criperto.github.io/">
  <meta property="og:image" content="https://github.com/Criperto.png?size=480">
  <link rel="icon" type="image/png" href="https://github.com/Criperto.png?size=64">
  <link rel="stylesheet" href="styles.css">
  <link rel="preload" href="assets/fonts/big-shoulders-display-800.woff2" as="font" type="font/woff2" crossorigin>
  <script src="js/core.js" defer></script>
  <script src="js/spring.js" defer></script>
  <script src="js/lightbox.js" defer></script>
  <script src="js/gallery.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <a class="skip" href="#proyectos" data-i18n="skip">Saltar al contenido</a>

  <header class="top">
    <a class="brand" href="#inicio" aria-label="Criperto">
      <img src="assets/Criperto.png" alt="Criperto" width="160" height="40">
    </a>
    <nav class="top-nav" aria-label="Principal">
      <a href="#proyectos" data-i18n="nav.projects">Proyectos</a>
      <a href="#enlaces" data-i18n="nav.links">Enlaces</a>
    </nav>
    <div class="lang" role="group" data-i18n-label="lang.label" aria-label="Idioma">
      <button type="button" data-lang-btn="es" aria-pressed="true">ES</button>
      <button type="button" data-lang-btn="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="side" id="side" aria-label="Proyectos" hidden></nav>

  <main>
    <section class="hero" id="inicio">
      <div class="wrap hero-grid">
        <div class="hero-text">
          <h1 id="bio" aria-live="polite"></h1>
          <a class="btn btn-accent" href="#proyectos" data-i18n="hero.cta">Ver los proyectos</a>
        </div>
        <div class="hero-pic">
          <img src="https://github.com/Criperto.png?size=480" alt="Criperto" width="480" height="480" fetchpriority="high">
        </div>
      </div>
    </section>

    <section class="projects" id="proyectos" aria-labelledby="proyectos-h">
      <div class="wrap">
        <h2 id="proyectos-h" data-i18n="projects.title">Proyectos</h2>
      </div>
      <div id="lista" aria-live="polite"></div>
    </section>

    <section class="links" id="enlaces" aria-labelledby="enlaces-h">
      <div class="wrap">
        <h2 id="enlaces-h" data-i18n="links.title">Donde más me encontrás</h2>
        <ul class="link-list">
          <li><a class="btn" href="https://github.com/Criperto" target="_blank" rel="noopener">GitHub</a></li>
          <li><a class="btn" href="https://www.youtube.com/@Criperto16" target="_blank" rel="noopener">YouTube</a></li>
          <li><a class="btn" href="https://www.tiktok.com/@criperto_oficial" target="_blank" rel="noopener">TikTok</a></li>
          <li><a class="btn" href="https://www.hoyolab.com/accountCenter/postList?id=107409618" target="_blank" rel="noopener">HoYoLAB</a></li>
        </ul>
      </div>
    </section>
  </main>

</html>
